<!doctype html>
<html lang="zh-CN">
<head>
  <base href="/lush-portfolio/">
  <link rel="canonical" href="https://4zyc.cn/">
  <meta name="description" content="Albert Lush 张誉聪的 LUSH 作品集，展示项目经历、设计作品、交互原型与个人简历。">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>张誉聪｜一枚AI产品创意设计玩家｜郁葱空间作品集</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23dce8f5' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-mini-preview.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-liquid-candidate.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-uiux.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-process-redesign.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-hr-ready.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-native-sync.css?v=20261011-native-site-sync-v12">
  <link rel="stylesheet" href="LUSH-portfolio-preview_files/LUSH-desktop.css?v=20261011-desktop-showcase-v1">
<style id="compact-short-landscape">
@media (min-width: 900px) and (max-height: 780px) and (pointer: fine) {
  .liquid-candidate .content-wordmark { margin-bottom: 10px; }
  .liquid-candidate .section-head { margin-bottom: 16px; }
  .liquid-candidate .section-head .page-title { font-size: clamp(38px, 6vw, 64px); }
  .liquid-candidate .portfolio-value { padding-top: 12px; padding-bottom: 12px; }
  .liquid-candidate .portfolio-value-copy > p { margin-top: 5px; line-height: 1.4; }
  .liquid-candidate .filters { margin-bottom: 10px; }
}
</style>
</head>
<body class="liquid-candidate">
  <div class="preview-frame liquid-welcome-active" id="previewFrame">
    <section class="welcome-layer" id="welcomeLayer" aria-label="欢迎页">
      <div class="stars" aria-hidden="true"></div>
      <img class="welcome-mark" src="LUSH-portfolio-preview_files/assets/native/lush-wordmark-mobile.png" alt="" aria-hidden="true">
      <p class="welcome-portfolio-label" aria-hidden="true">PORTFOLIO</p>
      <div class="welcome-stickers" id="welcomeStickers" aria-hidden="true"></div>
      <p class="welcome-idle-hint" aria-hidden="true">上滑进入</p>
      <div class="welcome-dome" id="welcomeDome" role="button" tabindex="0" aria-label="上滑展开作品集入口"><span>+</span></div>
      <div class="welcome-copy" id="welcomeCopy">
        <h1>探索郁葱的艺术世界</h1>
        <button class="primary-button" id="enterButton" type="button">查看作品</button>
      </div>
    </section>

    <section class="portfolio-layer" id="portfolioLayer" hidden aria-label="LUSH 作品集">
      <div class="uiverse-starfield" aria-hidden="true"><div class="uiverse-stars-1"></div><div class="uiverse-stars-2"></div><div class="uiverse-stars-3"></div></div>
      <div class="wechat-capsule-preview" aria-hidden="true"><span class="wechat-capsule-dots"><i></i><i></i><i></i></span><span class="wechat-capsule-divider"></span><span class="wechat-capsule-ring"></span></div>
      <main class="page-scroll" id="pageScroll">
        <div class="page-content" id="pageContent"></div>
      </main>
      <nav class="dock" aria-label="底部导航">
        <button class="dock-side current" id="worksButton" type="button" aria-current="page" aria-label="探索"><span class="dock-star" aria-hidden="true"></span><span class="dock-label">探索</span></button>
        <button class="dock-plus" id="menuButton" type="button" aria-label="打开页面目录" aria-haspopup="dialog" aria-expanded="false"><img class="dock-orb-asset" id="dockOrbAsset" src="LUSH-portfolio-preview_files/assets/root/dock-glass-orb-v2.png" alt="" aria-hidden="true"></button>
        <button class="dock-side" id="aboutButton" type="button" aria-current="false" aria-label="关于"><span class="dock-planet" aria-hidden="true"></span><span class="dock-label">关于</span></button>
      </nav>
      <div class="sheet-overlay" id="sheetOverlay" hidden>
        <section class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-label="页面目录">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-title"><h2>探索</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="关闭目录">×</button></div>
          <div id="menuRows"></div>
        </section>
      </div>
      <div class="knowledge-layer" id="knowledgeLayer" hidden role="dialog" aria-modal="true" aria-label="知识库储备">
        <div class="uiverse-starfield" aria-hidden="true"><div class="uiverse-stars-1"></div><div class="uiverse-stars-2"></div><div class="uiverse-stars-3"></div></div>
        <header class="knowledge-header"><button id="knowledgeBack" type="button" aria-label="返回知识库总览"><span class="knowledge-back-glyph" aria-hidden="true">‹</span><span>知识库</span></button><span>ALBERT / OBSIDIAN</span><button id="knowledgeClose" type="button" aria-label="关闭知识库">×</button></header>
        <main class="knowledge-scroll" id="knowledgeContent"></main>
      </div>
      <div class="detail-layer" id="detailLayer" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="uiverse-starfield" aria-hidden="true"><div class="uiverse-stars-1"></div><div class="uiverse-stars-2"></div><div class="uiverse-stars-3"></div></div>
        <header class="detail-header"><button class="detail-back" id="detailBack" type="button" aria-label="返回作品列表"><span aria-hidden="true">‹</span>作品</button></header>
        <main class="detail-scroll" id="detailContent"></main>
      </div>
      <div class="image-lightbox" id="imageLightbox" hidden role="dialog" aria-modal="true" aria-label="作品大图">
        <button class="lightbox-dismiss" id="lightboxClose" type="button" aria-label="关闭大图">×</button>
        <img id="lightboxImage" src="" alt="">
      </div>
      <div class="document-viewer" id="documentViewer" hidden role="dialog" aria-modal="true" aria-label="文档页面预览">
        <div class="document-viewer-panel">
          <div class="document-viewer-header"><span class="document-viewer-title" id="documentViewerTitle">项目资料</span><div class="document-viewer-actions"><button class="document-viewer-pdf" id="documentViewerPdf" type="button" aria-label="在新窗口打开 PDF">打开 PDF</button><button class="document-viewer-close" id="documentViewerClose" type="button" aria-label="关闭文档预览">×</button></div></div>
          <div class="document-viewer-canvas"><img id="documentViewerImage" class="document-viewer-image" src="" alt="" role="button" tabindex="0" aria-label="点击查看大图"><p id="documentViewerHint" class="document-viewer-hint">正在加载页面预览</p></div>
          <section class="document-viewer-copy" id="documentViewerCopy" hidden aria-live="polite" aria-label="页面设计说明">
            <div class="document-viewer-copy-head"><span>DESIGN NOTE</span><span id="documentViewerIndex"></span></div>
            <h2>设计说明</h2>
            <div class="document-viewer-note"><h3>设计思路</h3><p id="documentViewerIdea"></p></div>
            <div class="document-viewer-note"><h3>设计过程</h3><p id="documentViewerProcess"></p></div>
            <div class="document-viewer-note"><h3>思考</h3><p id="documentViewerThinking"></p></div>
            <div class="document-viewer-note"><h3>遇到的问题</h3><p id="documentViewerProblems"></p></div>
            <div class="document-viewer-note"><h3>不足之处</h3><p id="documentViewerLimitations"></p></div>
          </section>
        </div>
      </div>
    </section>
  </div>
  <script src="LUSH-portfolio-preview_files/scene/liquid-core.js?v=20260927-copy-progress-v1"></script>
  <script src="LUSH-portfolio-preview_files/scene/liquid-renderer.js?v=20261008-portable-assets-v1"></script>
  <script src="LUSH-portfolio-preview_files/LUSH-current-data.js?v=20261011-native-site-sync-v13"></script>
  <script src="LUSH-portfolio-preview_files/LUSH-liquid-candidate.js?v=20261011-desktop-showcase-v2"></script>
</body>
</html>
